name: Local contract and corpus checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Contract text assertions (not behavioral verification)
        run: bash checks/adversarial-contract.sh
      - name: Tool regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate template and fictional examples
        run: |
          python3 tools/corpus.py check --root .
          python3 tools/corpus.py check --root examples/meridian
          python3 tools/corpus.py check --root examples/harbor
